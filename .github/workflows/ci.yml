name: CI

on:
  push:
  pull_request:

jobs:
  PHPUnit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php:
          - 8.5
          - 8.4
          - 8.3
          - 8.2
          - 8.1
          - 7.4
          - 7.3
        # - 7.2 # skip temporarily due to version conflicts
          - 7.1
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
      - run: composer install
      - run: vendor/bin/phpunit --coverage-text --exclude-group internet # skip temporarily due to unavailable SOAP service, see #58
        if: ${{ matrix.php >= 7.3 }}
      - run: vendor/bin/phpunit --coverage-text -c phpunit.xml.legacy --exclude-group internet # skip temporarily due to unavailable SOAP service, see #58
        if: ${{ matrix.php < 7.3 }}
